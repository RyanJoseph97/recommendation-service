server.port=8082
server.servlet.context-path=/recommendation-service

# Database Configuration (H2 in all profiles)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Jackson — serialize LocalDateTime as ISO-8601 strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT — must be provided via environment (Secrets Manager in prod); fail fast if missing.
jwt.secret=${JWT_SECRET:?JWT_SECRET must be set}
jwt.expiration=86400000

# Downstream service URLs (Docker internal hostnames)
user.service.base-url=http://user-service:8080/user-service
event.service.base-url=http://event-service:8081/event-service

# Logging
logging.level.root=INFO
logging.level.com.eventmaster=INFO
logging.file.name=logs/recommendation-service.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Distributed Tracing
spring.zipkin.enabled=true
spring.zipkin.base-url=${SPRING_ZIPKIN_BASE_URL:http://zipkin:9411}
spring.sleuth.sampler.probability=1.0
